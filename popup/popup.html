<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xnapture</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-header">
    <div class="popup-logo">✦</div>
    <div>
      <div class="popup-title">Xnapture</div>
      <div class="popup-subtitle">Beautiful Screenshots</div>
    </div>
  </div>

  <div class="popup-body">
    <button class="popup-btn primary" id="btn-capture-screen">
      <span class="btn-icon">📸</span>
      <span class="btn-text">
        <strong>Capture Screen</strong>
        <span>Full visible viewport</span>
      </span>
    </button>

    <button class="popup-btn" id="btn-select-region">
      <span class="btn-icon">✂️</span>
      <span class="btn-text">
        <strong>Select Region</strong>
        <span>Click and drag to capture</span>
      </span>
    </button>
  </div>

  <div class="popup-footer">
    <span class="popup-version">Xnapture v1.0.0</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
